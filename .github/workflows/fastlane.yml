- name: Find APK files
      run: |
        echo "🔍 Ищем APK файлы..."
        find V2rayNG/app/build/outputs/apk -name "*.apk" -type f || true
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Saturn7-VPN-APK
        path: V2rayNG/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error
