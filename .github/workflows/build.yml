name: Build Saturn7 VPN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      
    - name: Get AndroidLibXrayLite version
      run: |
        cd AndroidLibXrayLite
        TAG=$(git describe --tags --abbrev=0)
        echo "LIB_TAG=$TAG" >> $GITHUB_ENV
        
    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.LIB_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/
        
    - name: Build Debug APK
      run: |
        cd V2rayNG
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        
    - name: Find APK
      run: |
        echo "Looking for APK..."
        find V2rayNG/app/build/outputs/apk -name "*.apk" -type f
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Saturn7-VPN-Debug
        path: |
          V2rayNG/app/build/outputs/apk/**/debug/*.apk
          V2rayNG/app/build/outputs/apk/debug/*.apk
        retention-days: 5
        if-no-files-found: error
        
    - name: List artifact contents
      run: |
        echo "Artifact uploaded successfully"
        ls -la V2rayNG/app/build/outputs/apk/debug/ || true
